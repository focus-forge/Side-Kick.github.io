<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusForge - Legal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.7;
            color: #e0e0e0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            font-size: 4em;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 1.1em;
            color: #a0a0ff;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: block;
            padding: 20px 30px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-size: 1.2em;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .link-card:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
        }

        .link-card .icon {
            margin-right: 10px;
        }

        .link-card .description {
            display: block;
            font-size: 0.7em;
            color: #a0a0a0;
            font-weight: normal;
            margin-top: 5px;
        }

        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 0.9em;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚒️</div>
        <h1>FocusForge</h1>
        <p class="tagline">Built for ADHD brains, with love</p>

        <div class="links">
            <a href="privacy-policy.html" class="link-card">
                <span class="icon">🔒</span> Privacy Policy
                <span class="description">How we protect your data</span>
            </a>
            <a href="terms-of-service.html" class="link-card">
                <span class="icon">📜</span> Terms of Service
                <span class="description">The rules of engagement</span>
            </a>
        </div>

        <div class="footer">
            <p>Copyright &copy; 2026 FocusForge. All Rights Reserved.</p>
            <p>Questions? <a href="mailto:caazamar@gmail.com">caazamar@gmail.com</a></p>
        </div>
    </div>
</body>
</html>
